global:
  orgId: 1
  defaultTag: ""

api:
  baseUrl: "https://qs.fangcunmount.cn"
  collectionBaseUrl: "https://collect.fangcunmount.cn"
  token: ""
  retry:
    maxRetries: 3
    minDelay: "200ms"
    maxDelay: "5s"

iam:
  baseUrl: "https://iam.fangcunmount.cn"
  loginUrl: "https://iam.fangcunmount.cn/api/v2/authn/login"
  username: ""
  password: ""
  tenantId: "1"
  mockConsumer:
    enabled: true
    # 只允许通过 IAM_MOCK_CONSUMER_SHARED_SECRET 或部署密钥注入。
    sharedSecret: ""
    endpointPath: "/api/v2/internal/authn/mock-consumers/ensure"
    # 保护 IAM 网关：mock C 端建号/登录默认串行执行，必要时可按机器能力调大。
    maxConcurrent: 1
  grpc:
    address: "iam-apiserver:9090"
    timeout: "15s"
    retryMax: 3
    tls:
      enabled: false
      caFile: ""
      certFile: ""
      keyFile: ""
      serverName: ""
      insecureSkipVerify: false

dailySimulation:
  countMin: 40        # 每日模拟最小用户数
  countMax: 200       # 每日模拟最大用户数
  dailyMaxUsers: 300  # 每日模拟用户数上限，超过后当天不再执行模拟；建议设置为 countMax 的整数倍以保证模拟效果，同时也要考虑 IAM 承受能力
  workers: 10          # 模拟并发数，建议不超过 10，以免 IAM 压力过大
  runAt: "10:00"      # 兼容单次调度；设置 windowStartAt/windowEndAt/interval 后按窗口模式执行
  windowStartAt: "10:00"  # 模拟时间窗口开始时间，格式 "HH:mm"
  windowEndAt: "23:00"    # 模拟时间窗口结束时间，格式 "HH:mm"
  interval: "30m"         # 模拟时间窗口内每轮执行间隔，格式支持 Go Duration，如 "30m"、"1h15m" 等；设置后按窗口模式执行
  retryDelay: "30m"       # 模拟失败重试间隔，格式支持 Go Duration，如 "30m"、"1h15m" 等；设置后模拟失败时会在间隔后重试，直到 runDate 结束
  stateFile: ".seeddata-cache/daily-simulation-daemon-state.json"
  submissionStateFile: ".seeddata-cache/daily-simulation-submissions.json"
  clinicianIds:
    - 614995509882401326
    - 615086081481650734
    - 615086709855498798
    - 615086769280397870
    - 615086872040845870
    - 615086919386149422
    - 615087703368675886
    - 615087755663258158
    - 615087818779144750
    - 615087864044073518
    - 615088273357812270
    - 615088307902100014
    - 615088351405421102
    - 615088385312174638
    - 615088855208440366
    - 615089195702039086
    - 615089235111719470
  focusCliniciansPerRunMin: 3 # 每日模拟医生数量最小值
  focusCliniciansPerRunMax: 5 # 每日模拟医生数量最大值
  entryId: ""
  targetType: "scale"
  targetCode: "3adyDE" # 入口量表；每个 testee 仍然只拿一个入口
  targetVersion: ""
  additionalTargetCodes: ["zOO4eG", "WFIRSP", "bJFKi3", "mbdoeV", "tuixuu", "sJFa2R", "tssl35", "zOO4eG"] # 入口填完后可额外填报的量表编码池，例如 ["PHQ9", "GAD7"]
  additionalTargetMaxCount: 2 # 每个 testee 从 additionalTargetCodes 中随机抽取 1..N 个填报；0 表示不额外填报
  userPassword: "DailySim@123"
  userPhonePrefix: "+86199"
  userEmailDomain: "fangcunmount.com"
  guardianRelation: "other"
  testeeSource: "daily_simulation"
  testeeTags: []
  isKeyFocus: false
  planIds:
    - "614333603412718126"
  journeyMix:
    registerOnlyWeight: 10  # ~10% 只注册账号；各档位之和不必等于 100，按相对权重分流
    createTesteeWeight: 15  # ~15% 走公开 intake 建档案后停，不写答卷
    resolveEntryWeight: 25  # ~25% 完成入口接入后停，拉开 entry/testee 与答卷指标
    submitAnswerWeight: 50  # ~50% 走完全流程；planSubmit 另有 completionPercent 控制提交比例

historicalBackfill:
  parentWorkers: 8
  submissionWorkers: 2
  stageReadWorkers: 4
  iamWorkers: 1
  progressInterval: "15s"

planSubmit:
  submissionStateFile: ".seeddata-cache/plan-submit-submissions.json"
  planIds:
    - "614333603412718126"
    - "614187067651404334"
  workers: 1
  completionPercent: 60 # 每天最多完成当天 seeddata testee task 的百分比；100 表示提交所有当天 seeddata opened task
  idleInterval: "1h"    # 计划提交空闲轮询间隔
  activeInterval: "30m" # 计划提交在发现 opened task 后的下一轮轮询间隔

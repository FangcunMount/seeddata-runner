name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.9'
  GOTOOLCHAIN: go1.25.9

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  race:
    name: Ordinary Package Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Race test
        run: |
          go test -race \
            ./internal/answersheet \
            ./internal/dailysim \
            ./internal/plansubmit \
            ./internal/seedapi \
            ./internal/seedruntime

  repository-contracts:
    name: Repository Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

      - name: Validate shell scripts
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

  build:
    name: Linux Static Build
    needs: [test, race, repository-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          mkdir -p tmp/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o tmp/bin/seeddata ./cmd/seeddata
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -o tmp/bin/seeddata-arm64 ./cmd/seeddata
          file tmp/bin/seeddata
          file tmp/bin/seeddata-arm64

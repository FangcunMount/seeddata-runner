name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.9'
  GOTOOLCHAIN: go1.25.9

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Run tests
        run: go test ./...

  race:
    name: Historical Backfill Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run historical race tests
        run: |
          go test -race \
            ./internal/answersheet \
            ./internal/dailysim \
            ./internal/seedruntime

  deployment-contracts:
    name: Deployment Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh scripts/cd/*.sh
          bash scripts/cd/test-contracts.sh

  build:
    name: Linux Build
    needs: [test, race, deployment-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build static binary
        run: |
          mkdir -p tmp/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o tmp/bin/seeddata ./cmd/seeddata
          file tmp/bin/seeddata

      - name: Build historical image
        run: |
          docker build \
            --file Dockerfile.historical \
            --tag seeddata-runner:historical-ci \
            .


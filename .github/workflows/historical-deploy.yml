name: Historical Backfill Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '输入 START_HISTORICAL_BACKFILL 才允许部署'
        required: true
        type: string
      batch_id:
        description: '稳定批次 ID；正式批次不得更换'
        required: true
        type: string
        default: hist-20250101-20260727-v2
      from:
        description: '首个业务日期（YYYY-MM-DD）'
        required: true
        type: string
        default: '2025-01-01'
      to:
        description: '最后业务日期（YYYY-MM-DD）'
        required: true
        type: string
        default: '2026-07-27'
      resume:
        description: '复用同一个 v2 状态；空批次会安全创建初始状态'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: seeddata-historical-production
  cancel-in-progress: false

env:
  GO_VERSION: '1.25.9'
  GOTOOLCHAIN: go1.25.9
  IMAGE_REF: ghcr.io/fangcunmount/seeddata-runner-historical:${{ github.sha }}

jobs:
  validate:
    name: Validate Production Request
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch guard
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          BATCH_ID: ${{ inputs.batch_id }}
          FROM_DATE: ${{ inputs.from }}
          TO_DATE: ${{ inputs.to }}
          RESUME: ${{ inputs.resume }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main || {
            echo "Historical production deploy must run from main" >&2
            exit 1
          }
          test "$CONFIRMATION" = START_HISTORICAL_BACKFILL || {
            echo "confirmation must be START_HISTORICAL_BACKFILL" >&2
            exit 1
          }
          case "$BATCH_ID" in
            ''|*[!A-Za-z0-9_.-]*)
              echo "invalid batch_id" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$FROM_DATE" "$TO_DATE" |
            grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          if [ "$BATCH_ID" = hist-20250101-20260727-v2 ]; then
            test "$FROM_DATE" = 2025-01-01
            test "$TO_DATE" = 2026-07-27
            test "$RESUME" = true
          fi

  package:
    name: Build Immutable Deployment
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test deploy revision
        run: |
          go test ./...
          go test -race \
            ./internal/answersheet \
            ./internal/dailysim \
            ./internal/seedruntime
          bash -n scripts/*.sh scripts/cd/*.sh
          bash scripts/cd/test-contracts.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.historical \
            --tag "$IMAGE_REF" \
            --push \
            .
          docker pull "$IMAGE_REF"
          docker save "$IMAGE_REF" |
            gzip -1 > seeddata-historical-image.tar.gz
          gzip -t seeddata-historical-image.tar.gz

      - name: Build deployment package
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          mkdir -p deploy-package/configs deploy-package/scripts/cd
          install -m 0644 configs/seeddata.yaml deploy-package/configs/seeddata.yaml
          install -m 0755 scripts/run_historical_container.sh deploy-package/scripts/run_historical_container.sh
          install -m 0755 scripts/cd/remote-deploy.sh deploy-package/scripts/cd/remote-deploy.sh
          printf '%s\n' "$DEPLOY_SHA" > deploy-package/REVISION
          tar -czf seeddata-historical-package.tar.gz -C deploy-package .
          gzip -t seeddata-historical-package.tar.gz
          sha256sum \
            seeddata-historical-image.tar.gz \
            seeddata-historical-package.tar.gz \
            > seeddata-historical-artifacts.sha256

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seeddata-historical-${{ github.sha }}
          path: |
            seeddata-historical-image.tar.gz
            seeddata-historical-package.tar.gz
            seeddata-historical-artifacts.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Start on ServerA
    needs: [package]
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: seeddata-historical-${{ github.sha }}
          path: deploy-artifacts

      - name: Verify deployment artifacts
        run: |
          cd deploy-artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c seeddata-historical-artifacts.sha256
          else
            shasum -a 256 -c seeddata-historical-artifacts.sha256
          fi
          gzip -t seeddata-historical-image.tar.gz
          gzip -t seeddata-historical-package.tar.gz

      - name: Setup ServerA SSH
        env:
          SEEDDATA_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
          SEEDDATA_SSH_HOST: ${{ vars.SVRA_PUBLIC_HOST || secrets.SVRA_PUBLIC_HOST || vars.SVRA_HOST }}
          SEEDDATA_SSH_USER: ${{ vars.SVRA_USERNAME }}
          SEEDDATA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          SEEDDATA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT || secrets.SVRA_SSH_FINGERPRINT }}
          SEEDDATA_EXPECTED_HOSTNAME: serverA
        run: bash scripts/cd/setup-ssh.sh

      - name: Upload and start historical backfill
        env:
          SEEDDATA_IMAGE_ARCHIVE: deploy-artifacts/seeddata-historical-image.tar.gz
          SEEDDATA_PACKAGE_ARCHIVE: deploy-artifacts/seeddata-historical-package.tar.gz
          SEEDDATA_DEPLOY_SHA: ${{ github.sha }}
          SEEDDATA_IMAGE_REF: ${{ env.IMAGE_REF }}
          SEEDDATA_BATCH_ID: ${{ inputs.batch_id }}
          SEEDDATA_FROM: ${{ inputs.from }}
          SEEDDATA_TO: ${{ inputs.to }}
          SEEDDATA_RESUME: ${{ inputs.resume && '1' || '0' }}
          SEEDDATA_STATE_DIR: ${{ vars.SEEDDATA_HISTORICAL_STATE_DIR || '/secure/path/seeddata-historical-state' }}
          SEEDDATA_SECRET_ENV_FILE: ${{ vars.SEEDDATA_HISTORICAL_ENV_FILE || '/secure/path/seeddata-historical.env' }}
          SEEDDATA_BASELINE_FILE: ${{ vars.SEEDDATA_HISTORICAL_BASELINE_FILE || '/secure/path/hist-20250101-20260727-v1.baseline.json' }}
          SEEDDATA_DEPLOY_ROOT: ${{ vars.SEEDDATA_HISTORICAL_DEPLOY_ROOT || '/opt/seeddata-runner-historical' }}
          SEEDDATA_LOG_DIR: ${{ vars.SEEDDATA_HISTORICAL_LOG_DIR || '/secure/path/seeddata-historical-logs' }}
          SEEDDATA_SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
        run: bash scripts/cd/upload-and-deploy.sh

      - name: Cleanup local deployment material
        if: always()
        run: |
          rm -rf deploy-artifacts
          rm -rf "${SEEDDATA_SSH_TEMP_DIR:-}" 2>/dev/null || true

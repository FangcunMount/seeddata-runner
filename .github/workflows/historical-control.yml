name: Historical Backfill Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: '只读状态检查或安全停止；不会删除数据'
        required: true
        type: choice
        options:
          - status
          - stop
      batch_id:
        description: '目标批次 ID'
        required: true
        type: string
        default: hist-20250101-20260727-v1
      confirmation:
        description: 'stop 时必须输入 STOP_HISTORICAL_BACKFILL；status 留空'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: seeddata-historical-production
  cancel-in-progress: false

jobs:
  control:
    name: ${{ inputs.operation == 'stop' && 'Stop on ServerA' || 'Status on ServerA' }}
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate request
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          if [ "$OPERATION" = stop ]; then
            test "$CONFIRMATION" = STOP_HISTORICAL_BACKFILL || {
              echo "stop requires STOP_HISTORICAL_BACKFILL" >&2
              exit 1
            }
          fi

      - name: Setup ServerA SSH
        env:
          SEEDDATA_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
          SEEDDATA_SSH_HOST: ${{ vars.SVRA_PUBLIC_HOST || secrets.SVRA_PUBLIC_HOST || vars.SVRA_HOST }}
          SEEDDATA_SSH_USER: ${{ vars.SVRA_USERNAME }}
          SEEDDATA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          SEEDDATA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT || secrets.SVRA_SSH_FINGERPRINT }}
          SEEDDATA_EXPECTED_HOSTNAME: serverA
        run: bash scripts/cd/setup-ssh.sh

      - name: Run ServerA control operation
        env:
          SEEDDATA_CONTROL_OPERATION: ${{ inputs.operation }}
          SEEDDATA_CONTROL_CONFIRMATION: ${{ inputs.confirmation }}
          SEEDDATA_BATCH_ID: ${{ inputs.batch_id }}
          SEEDDATA_DEPLOY_ROOT: ${{ vars.SEEDDATA_HISTORICAL_DEPLOY_ROOT || '/opt/seeddata-runner-historical' }}
          SEEDDATA_LOG_DIR: ${{ vars.SEEDDATA_HISTORICAL_LOG_DIR || '/secure/path/seeddata-historical-logs' }}
          SEEDDATA_SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
        run: bash scripts/cd/upload-control.sh

      - name: Cleanup SSH material
        if: always()
        run: rm -rf "${SEEDDATA_SSH_TEMP_DIR:-}" 2>/dev/null || true
